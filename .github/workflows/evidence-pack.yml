# DEMO / SYNTHETIC · for enablement only
# One evidence-pack comment per pull request. Later pushes edit that comment.
# Uses GITHUB_TOKEN only. Produces evidence for a validated process.

name: Evidence pack

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # Conversation comments on a pull request need pull-requests write.
  # issues write alone returns 403 for that endpoint.
  issues: write
  pull-requests: write

concurrency:
  group: evidence-pack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-pack:
    name: Tests and evidence pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Run tests
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/evidence"
          if [[ -f Makefile ]] && grep -Eq '^test:' Makefile; then
            command_label="make test"
            set +e
            make test > "${RUNNER_TEMP}/evidence/test.log" 2>&1
            code=$?
            set -e
          else
            command_label="Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'"
            set +e
            Rscript -e 'testthat::test_local(stop_on_failure = TRUE)' > "${RUNNER_TEMP}/evidence/test.log" 2>&1
            code=$?
            set -e
          fi
          printf '%s\n' "$command_label" > "${RUNNER_TEMP}/evidence/command"
          printf '%s\n' "$code" > "${RUNNER_TEMP}/evidence/exit_code"
          cat "${RUNNER_TEMP}/evidence/test.log"
          exit "$code"

      - name: Publish evidence-pack comment
        if: ${{ always() && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: python3 scripts/evidence-pack.py publish

      - name: Fail the check when tests fail
        if: ${{ always() && !cancelled() }}
        run: |
          code_file="${RUNNER_TEMP}/evidence/exit_code"
          if [[ ! -f "$code_file" ]]; then
            echo "Tests did not produce an exit code."
            exit 1
          fi
          code="$(cat "$code_file")"
          echo "Test exit code: ${code}"
          exit "$code"
