# Demo fork test workflow.
# The upstream admiralci workflow is not used: it calls reusable pharmaverse
# workflows, publishes a coverage badge, and bumps versions with an org token
# this fork does not have.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dependencies come from r-lib/actions, not from a project library restore.
  RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::diffdf
          install-pandoc: false
          install-quarto: false

      - name: Run tests
        run: make test
